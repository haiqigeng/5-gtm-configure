[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "configure-gtm"
version = "10.3.0"
description = "Operational web, server, and connected-pipeline GTM configuration skill"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
dev = ["jsonschema>=4.23,<5", "ruff>=0.12,<1", "mcp>=1.30,<2"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
