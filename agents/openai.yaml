interface:
  display_name: "Configure Google Tag Manager"
  short_description: "Configure GTM web, server, and connected pipelines"
  default_prompt: "Use $configure-gtm to operationally implement my approved analytics requirements or explicit media brief in authorized GTM web and/or server workspaces. Classify the run as web, server, or pipeline; preserve approved semantics; use current official documentation and inspected templates; apply the correct consent, transport, field-shape, and deduplication topology; configure receiver dependencies before any live sender cutover; verify every saved target and an identical-rerun no-op; return the evidence-backed configuration result; and never publish or create a version. Release 9.0.0."
