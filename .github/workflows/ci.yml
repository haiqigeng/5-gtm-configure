name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require relay runtimes
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 required" }
          node --version
          "REQUIRE_RELAY_TESTS=1" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install development dependencies
        run: python -m pip install "jsonschema>=4.23,<5" "ruff>=0.12,<1" -r scripts/requirements-mcp.txt
      - name: Check formatting and lint
        run: |
          python -m ruff format --no-cache --check scripts tests
          python -m ruff check --no-cache scripts tests
      - name: Validate release structure
        run: python scripts/check_release.py --tag v10.3.0 --release-notes CHANGELOG.md
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile scripts
        run: python -m compileall -q scripts
